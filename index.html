<!DOCTYPE html>
<html>
<head>
<title>💌 A Little Surprise</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffd1e3,#fff5fa,#ffdce9);
  overflow:hidden;
}

.card{
  width:90%;
  max-width:450px;
  background:rgba(255,255,255,.96);
  border-radius:30px;
  padding:38px 25px;
  text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,.18);
  z-index:5;
  animation:cardIn 1s ease;
}

@keyframes cardIn{
  0%{opacity:0;transform:scale(.5) rotate(-5deg)}
  70%{transform:scale(1.05) rotate(2deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}

.envelope{
  font-size:95px;
  cursor:pointer;
  display:inline-block;
  animation:shake 1.5s infinite,glow 2s infinite alternate;
}

@keyframes shake{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-8deg)}
  75%{transform:rotate(8deg)}
}

@keyframes glow{
  from{filter:drop-shadow(0 0 3px #ff77a8)}
  to{filter:drop-shadow(0 0 20px #ff77a8)}
}

h1{
  color:#ff3f7f;
  font-size:32px;
  text-shadow:0 0 10px #ffb4cd;
}

p{
  color:#777;
  font-size:18px;
  line-height:1.5;
}

button{
  border:0;
  padding:15px 42px;
  border-radius:40px;
  background:#ff3f7f;
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 7px 20px rgba(255,63,127,.35);
  margin:8px;
  transition:.25s;
}

button:hover{
  transform:scale(1.08);
}

button:active{
  transform:scale(.9);
}

.bigheart{
  font-size:105px;
  display:inline-block;
  animation:heartbeat 1s infinite;
  filter:drop-shadow(0 0 12px #ff719f);
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  25%{transform:scale(1.12)}
  50%{transform:scale(1.22)}
  75%{transform:scale(1.1)}
}

/* NO BUTTON */

#noBtn{
  background:#777;
  position:relative;
  transition:
    left .18s ease,
    top .18s ease,
    transform .18s ease;
}

.noRun{
  animation:noRun .3s ease;
}

@keyframes noRun{
  0%{transform:scale(1) rotate(0)}
  50%{transform:scale(.85) rotate(10deg)}
  100%{transform:scale(1) rotate(0)}
}

/* NOTIFICATION */

.notification{
  position:fixed;
  top:20px;
  right:20px;
  background:white;
  padding:15px 20px;
  border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.15);
  color:#ff3f7f;
  font-weight:bold;
  z-index:20;
  animation:slide 1s ease;
}

@keyframes slide{
  from{transform:translateX(150%)}
  to{transform:translateX(0)}
}

/* FLOATING HEARTS */

.heart{
  position:absolute;
  bottom:-50px;
  font-size:25px;
  animation:float 6s linear forwards;
  pointer-events:none;
  z-index:1;
}

@keyframes float{
  0%{
    transform:translateY(0) rotate(0) scale(.7);
    opacity:0;
  }
  15%{opacity:1}
  100%{
    transform:translateY(-110vh) rotate(360deg) scale(1.4);
    opacity:0;
  }
}

/* CONFETTI */

.confetti{
  position:absolute;
  top:-30px;
  font-size:25px;
  animation:fall 4s linear forwards;
  pointer-events:none;
  z-index:30;
}

@keyframes fall{
  0%{
    transform:translateY(0) rotate(0) scale(.5);
  }
  100%{
    transform:translateY(110vh) rotate(720deg) scale(1.2);
  }
}

.memory{
  font-size:60px;
  margin:15px;
  animation:pop 1s ease;
}

@keyframes pop{
  0%{transform:scale(0) rotate(-30deg)}
  70%{transform:scale(1.3) rotate(10deg)}
  100%{transform:scale(1) rotate(0)}
}

</style>
</head>

<body>

<div class="notification">
🔔 You have a surprise!
</div>

<div class="card" id="card">

  <div class="envelope" onclick="openLetter()">
    💌
  </div>

  <h1>Someone left you a message...</h1>

  <p>
    Tap the envelope to open it ✨
  </p>

</div>

  type();
}

      onmouseenter="runNo()"
      ontouchstart="runNo()"
      onclick="nope()">
      NO 🙂
    </button>

    <div id="reaction"></div>
  `;
}
